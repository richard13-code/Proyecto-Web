<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Maison — Portal Interno</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/css/style.css" />
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: #fcfbf9;">

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-4">
        
        <div class="card p-4 p-sm-5 shadow-sm border-0" style="background: #ffffff; border-radius: 0;">
          <div class="text-center mb-4">
            <span class="section-eyebrow" style="letter-spacing: 3px;">Acceso Privado</span>
            <h2 class="font-serif mt-1" style="font-size: 2rem;">Maison Portal</h2>
          </div>

          <div id="loginError" class="alert alert-danger py-2 small d-none" role="alert">
            <i class="bi bi-exclamation-circle me-2"></i> Credenciales incorrectas.
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label for="adminUser" class="form-label text-uppercase tracking-wider small text-muted" style="font-size: 0.75rem;">Usuario</label>
              <input type="text" class="form-control" id="adminUser" placeholder="ej. admin" required style="border-radius: 0; font-family: 'Jost';">
            </div>

            <div class="mb-4">
              <label for="adminPassword" class="form-label text-uppercase tracking-wider small text-muted" style="font-size: 0.75rem;">Contraseña</label>
              <input type="password" class="form-control" id="adminPassword" placeholder="••••••••" required style="border-radius: 0; font-family: 'Jost';">
            </div>

            <button type="submit" class="btn btn-category btn-category--dark w-100 py-2 mb-3" style="border-radius: 0;">
              Ingresar al Portal
            </button>
            
            <div class="text-center">
              <a href="index.html" class="text-muted small text-decoration-none" style="font-family: 'Jost'; font-size: 0.8rem;">
                <i class="bi bi-arrow-left me-1"></i> Volver a la tienda
              </a>
            </div>
          </form>
        </div>

      </div>
    </div>
  </div>

  <script type="module" src="src/js/login.js"></script>
</body>
</html>
